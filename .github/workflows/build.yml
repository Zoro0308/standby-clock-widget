          mkdir -p "app/src/main/java/com/standby/clockwidget"
          cat << 'EOF_FILE' > "app/src/main/java/com/standby/clockwidget/CalendarRenderer.java"
          package com.standby.clockwidget;
          
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import java.text.DateFormatSymbols;
          import java.util.Calendar;
          import java.util.Locale;
          
          public class CalendarRenderer {
          
              private static final int SIZE = 800;
              private static final int COLOR_ACCENT_RED = Color.parseColor("#F04942");
              private static final int COLOR_SUNDAY_GREY = Color.parseColor("#8E8E93");
              private static final int COLOR_TEXT_LIGHT = Color.parseColor("#FFFFFF");
              private static final int COLOR_TEXT_DARK = Color.parseColor("#1C1C1E");
          
              public static Bitmap renderCalendar(int themeMode) {
                  Bitmap bitmap = Bitmap.createBitmap(SIZE, SIZE, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bitmap);
          
                  boolean useDarkText = (themeMode == StandByWidgetProvider.MODE_LIGHT
                          || themeMode == StandByWidgetProvider.MODE_TRANS_DARK);
                  int primaryTextColor = useDarkText ? COLOR_TEXT_DARK : COLOR_TEXT_LIGHT;
          
                  Calendar now = Calendar.getInstance();
                  int currentYear = now.get(Calendar.YEAR);
                  int currentMonth = now.get(Calendar.MONTH);
                  int todayDay = now.get(Calendar.DAY_OF_MONTH);
          
                  String[] months = new DateFormatSymbols(Locale.US).getMonths();
                  String monthTitle = months[currentMonth].toUpperCase(Locale.US);
          
                  Calendar firstOfMonth = (Calendar) now.clone();
                  firstOfMonth.set(Calendar.DAY_OF_MONTH, 1);
                  int startCol = firstOfMonth.get(Calendar.DAY_OF_WEEK) - Calendar.SUNDAY; // 0=Sun .. 6=Sat
                  if (startCol < 0) {
                      startCol += 7;
                  }
                  int daysInMonth = firstOfMonth.getActualMaximum(Calendar.DAY_OF_MONTH);
                  int totalCells = startCol + daysInMonth;
                  int numRows = (int) Math.ceil(totalCells / 7.0);
          
                  float colStep = 94.0f;
                  float rowStep = 82.0f;
                  float gridCenterX = 400.0f;
                  float col0X = gridCenterX - 3.0f * colStep;
          
                  // Dynamically center the entire calendar block around Y = 400
                  float headerToDowGap = 82.0f;
                  float dowToRow0Gap = 84.0f;
                  float totalVerticalSpan = headerToDowGap + dowToRow0Gap + (numRows - 1) * rowStep;
                  float monthHeaderY = 400.0f - (totalVerticalSpan / 2.0f);
                  float dowHeaderY = monthHeaderY + headerToDowGap;
                  float row0Y = dowHeaderY + dowToRow0Gap;
          
                  // 1. Month Title (e.g., JULY)
                  Paint monthPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
                  monthPaint.setColor(COLOR_ACCENT_RED);
                  monthPaint.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                  monthPaint.setTextSize(44.0f);
                  monthPaint.setTextAlign(Paint.Align.LEFT);
                  monthPaint.setLetterSpacing(0.03f);
                  Paint.FontMetrics monthFm = monthPaint.getFontMetrics();
                  float monthBaseline = monthHeaderY - (monthFm.ascent + monthFm.descent) / 2.0f;
                  canvas.drawText(monthTitle, col0X - 16.0f, monthBaseline, monthPaint);
          
                  // 2. Day of Week Row (S M T W T F S)
                  String[] dowLabels = {"S", "M", "T", "W", "T", "F", "S"};
                  Paint dowPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
                  dowPaint.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  dowPaint.setTextSize(36.0f);
                  dowPaint.setTextAlign(Paint.Align.CENTER);
                  Paint.FontMetrics dowFm = dowPaint.getFontMetrics();
                  float dowBaseline = dowHeaderY - (dowFm.ascent + dowFm.descent) / 2.0f;
          
                  for (int c = 0; c < 7; c++) {
                      float cx = col0X + c * colStep;
                      dowPaint.setColor(c == 0 ? COLOR_SUNDAY_GREY : primaryTextColor);
                      canvas.drawText(dowLabels[c], cx, dowBaseline, dowPaint);
                  }
          
                  // 3. Date Grid (1 .. daysInMonth)
                  Paint dayPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
                  dayPaint.setTextSize(37.0f);
                  dayPaint.setTextAlign(Paint.Align.CENTER);
                  Typeface mediumTf = Typeface.create("sans-serif-medium", Typeface.NORMAL);
                  Typeface boldTf = Typeface.create("sans-serif", Typeface.BOLD);
          
                  Paint circlePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  circlePaint.setStyle(Paint.Style.FILL);
                  circlePaint.setColor(COLOR_ACCENT_RED);
          
                  for (int day = 1; day <= daysInMonth; day++) {
                      int cellIndex = startCol + (day - 1);
                      int r = cellIndex / 7;
                      int c = cellIndex % 7;
          
                      float cx = col0X + c * colStep;
                      float cy = row0Y + r * rowStep;
          
                      if (day == todayDay) {
                          canvas.drawCircle(cx, cy, 41.0f, circlePaint);
                          dayPaint.setTypeface(boldTf);
                          dayPaint.setColor(COLOR_TEXT_LIGHT);
                      } else {
                          dayPaint.setTypeface(mediumTf);
                          dayPaint.setColor(c == 0 ? COLOR_SUNDAY_GREY : primaryTextColor);
                      }
          
                      Paint.FontMetrics dayFm = dayPaint.getFontMetrics();
                      float dayBaseline = cy - (dayFm.ascent + dayFm.descent) / 2.0f;
                      canvas.drawText(String.valueOf(day), cx, dayBaseline, dayPaint);
                  }
          
                  return bitmap;
              }
          }
          EOF_FILE

