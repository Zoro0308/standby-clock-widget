          package com.standby.clockwidget;
          
          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          public class MainActivity extends Activity {
          
              private TextView statusLabel;
              private ImageView calendarPreview;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setBackgroundColor(Color.parseColor("#0B0F17"));
                  scrollView.setFillViewport(true);
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(28), dp(32), dp(28), dp(32));
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  scrollView.addView(root);
          
                  TextView title = new TextView(this);
                  title.setText("StandBy Clock & Calendar Widget");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22f);
                  title.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                  root.addView(title);
          
                  TextView subtitle = new TextView(this);
                  subtitle.setText("Xiaomi Pad 8 (Android 16) • Live Ticking Second Needle");
                  subtitle.setTextColor(Color.parseColor("#94A3B8"));
                  subtitle.setTextSize(14f);
                  subtitle.setPadding(0, dp(6), 0, dp(20));
                  root.addView(subtitle);
          
                  statusLabel = new TextView(this);
                  statusLabel.setTextColor(Color.parseColor("#F59E23"));
                  statusLabel.setTextSize(15f);
                  statusLabel.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  statusLabel.setPadding(0, 0, 0, dp(16));
                  root.addView(statusLabel);
          
                  calendarPreview = new ImageView(this);
                  LinearLayout.LayoutParams prevParams = new LinearLayout.LayoutParams(dp(220), dp(220));
                  prevParams.bottomMargin = dp(20);
                  calendarPreview.setLayoutParams(prevParams);
                  root.addView(calendarPreview);
          
                  Button pinBtn = makeButton("Pin Widget to Home Screen", "#F04942", "#FFFFFF");
                  pinBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          requestPinWidget();
                      }
                  });
                  root.addView(pinBtn);
          
                  TextView modeHeading = new TextView(this);
                  modeHeading.setText("Switch Widget Background Mode (or Tap Clock Face on Home Screen):");
                  modeHeading.setTextColor(Color.parseColor("#CBD5E1"));
                  modeHeading.setTextSize(14f);
                  modeHeading.setPadding(0, dp(18), 0, dp(10));
                  root.addView(modeHeading);
          
                  LinearLayout row1 = new LinearLayout(this);
                  row1.setOrientation(LinearLayout.HORIZONTAL);
                  row1.setGravity(Gravity.CENTER);
                  row1.addView(makeModeButton("1. Dark Mode", StandByWidgetProvider.MODE_DARK));
                  row1.addView(makeModeButton("2. Light Mode", StandByWidgetProvider.MODE_LIGHT));
                  root.addView(row1);
          
                  LinearLayout row2 = new LinearLayout(this);
                  row2.setOrientation(LinearLayout.HORIZONTAL);
                  row2.setGravity(Gravity.CENTER);
                  row2.addView(makeModeButton("3. Transparent (Light Text)", StandByWidgetProvider.MODE_TRANS_LIGHT));
                  row2.addView(makeModeButton("4. Transparent (Dark Text)", StandByWidgetProvider.MODE_TRANS_DARK));
                  root.addView(row2);
          
                  TextView tipBox = new TextView(this);
                  tipBox.setText("Xiaomi HyperOS Tip:\n• Tap the Clock half of the widget anytime on your home screen to cycle through Dark, Light, and Transparent modes.\n• Tap the Calendar half to refresh and open your Calendar.\n• In App Info -> Battery, select 'No restrictions' so theme switching and midnight date rollover stay instant.");
                  tipBox.setTextColor(Color.parseColor("#94A3B8"));
                  tipBox.setTextSize(13f);
                  tipBox.setPadding(dp(16), dp(20), dp(16), dp(10));
                  root.addView(tipBox);
          
                  setContentView(scrollView);
                  refreshUi();
              }
          
              private Button makeButton(String text, String bgHex, String fgHex) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.parseColor(fgHex));
                  b.setTextSize(14f);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.parseColor(bgHex));
                  gd.setCornerRadius(dp(12));
                  b.setBackground(gd);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  lp.setMargins(dp(6), dp(6), dp(6), dp(6));
                  b.setLayoutParams(lp);
                  b.setPadding(dp(20), dp(12), dp(20), dp(12));
                  return b;
              }
          
              private Button makeModeButton(String label, final int mode) {
                  Button b = makeButton(label, "#1E293B", "#F8FAFC");
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          StandByWidgetProvider.setThemeModeForAll(MainActivity.this, mode);
                          refreshUi();
                          Toast.makeText(MainActivity.this, "Applied: " + label, Toast.LENGTH_SHORT).show();
                      }
                  });
                  return b;
              }
          
              private void refreshUi() {
                  int mode = StandByWidgetProvider.getThemeMode(this, AppWidgetManager.INVALID_APPWIDGET_ID);
                  String[] names = {
                      "Dark Mode (#000000)",
                      "Light Mode (#F2F2F7)",
                      "Transparent (White Clock & Text)",
                      "Transparent (Dark Clock & Text)"
                  };
                  statusLabel.setText("Active Mode: " + names[mode % 4]);
                  calendarPreview.setImageBitmap(CalendarRenderer.renderCalendar(mode));
                  GradientDrawable previewBg = new GradientDrawable();
                  previewBg.setCornerRadius(dp(20));
                  if (mode == StandByWidgetProvider.MODE_LIGHT || mode == StandByWidgetProvider.MODE_TRANS_DARK) {
                      previewBg.setColor(Color.parseColor("#F2F2F7"));
                  } else {
                      previewBg.setColor(Color.parseColor("#000000"));
                  }
                  calendarPreview.setBackground(previewBg);
              }
          
              private void requestPinWidget() {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(this);
                  ComponentName cn = new ComponentName(this, StandByWidgetProvider.class);
                  if (mgr.isRequestPinAppWidgetSupported()) {
                      mgr.requestPinAppWidget(cn, null, null);
                  } else {
                      Toast.makeText(this, "Pin from Home Screen -> Widgets -> Android Widgets", Toast.LENGTH_LONG).show();
                  }
              }
          
              private int dp(int value) {
                  float density = getResources().getDisplayMetrics().density;
                  return Math.round(value * density);
              }
          }
          EOF_FILE

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Signed APK
        working-directory: standby_widget_build
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../StandByClockWidget.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: StandByClockWidget-APK
          path: StandByClockWidget.apk
          if-no-files-found: error
