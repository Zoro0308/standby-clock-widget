          cat << 'EOF_FILE' > "app/src/main/java/com/standby/clockwidget/StandByWidgetProvider.java"
          package com.standby.clockwidget;
          
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.CalendarContract;
          import android.widget.RemoteViews;
          import android.widget.Toast;
          import java.util.Calendar;
          
          public class StandByWidgetProvider extends AppWidgetProvider {
          
              public static final String ACTION_CYCLE_THEME = "com.standby.clockwidget.ACTION_CYCLE_THEME";
              public static final String ACTION_OPEN_CALENDAR = "com.standby.clockwidget.ACTION_OPEN_CALENDAR";
              public static final String EXTRA_WIDGET_ID = "extra_widget_id";
          
              public static final String PREFS_NAME = "StandByWidgetPrefs";
              public static final String KEY_GLOBAL_THEME = "global_theme_mode";
              public static final String KEY_WIDGET_PREFIX = "widget_theme_";
          
              public static final int MODE_DARK = 0;
              public static final int MODE_LIGHT = 1;
              public static final int MODE_TRANS_LIGHT = 2;
              public static final int MODE_TRANS_DARK = 3;
          
              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, appWidgetId);
                  }
                  scheduleMidnightUpdate(context);
              }
          
              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager appWidgetManager,
                                                    int appWidgetId, Bundle newOptions) {
                  super.onAppWidgetOptionsChanged(context, appWidgetManager, appWidgetId, newOptions);
                  updateSingleWidget(context, appWidgetManager, appWidgetId);
              }
          
              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (intent == null || intent.getAction() == null) {
                      return;
                  }
          
                  String action = intent.getAction();
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  ComponentName cn = new ComponentName(context, StandByWidgetProvider.class);
                  int[] allIds = mgr.getAppWidgetIds(cn);
          
                  if (ACTION_CYCLE_THEME.equals(action)) {
                      int widgetId = intent.getIntExtra(EXTRA_WIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      int currentMode = getThemeMode(context, widgetId);
                      int nextMode = (currentMode + 1) % 4;
          
                      SharedPreferences.Editor editor = prefs.edit();
                      editor.putInt(KEY_GLOBAL_THEME, nextMode);
                      if (widgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                          editor.putInt(KEY_WIDGET_PREFIX + widgetId, nextMode);
                      }
                      for (int id : allIds) {
                          editor.putInt(KEY_WIDGET_PREFIX + id, nextMode);
                      }
                      editor.apply();
          
                      for (int id : allIds) {
                          updateSingleWidget(context, mgr, id);
                      }
                  } else if (ACTION_OPEN_CALENDAR.equals(action)) {
                      for (int id : allIds) {
                          updateSingleWidget(context, mgr, id);
                      }
                      openNativeCalendar(context);
                  } else if (Intent.ACTION_DATE_CHANGED.equals(action)
                          || Intent.ACTION_TIME_SET.equals(action)
                          || Intent.ACTION_TIMEZONE_CHANGED.equals(action)
                          || Intent.ACTION_LOCALE_CHANGED.equals(action)) {
                      for (int id : allIds) {
                          updateSingleWidget(context, mgr, id);
                      }
                      scheduleMidnightUpdate(context);
                  }
              }
          
              public static int getThemeMode(Context context, int appWidgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  int globalMode = prefs.getInt(KEY_GLOBAL_THEME, MODE_DARK);
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      return globalMode;
                  }
                  return prefs.getInt(KEY_WIDGET_PREFIX + appWidgetId, globalMode);
              }
          
              public static void setThemeModeForAll(Context context, int mode) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  ComponentName cn = new ComponentName(context, StandByWidgetProvider.class);
                  int[] allIds = mgr.getAppWidgetIds(cn);
          
                  SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  SharedPreferences.Editor editor = prefs.edit();
                  editor.putInt(KEY_GLOBAL_THEME, mode);
                  for (int id : allIds) {
                      editor.putInt(KEY_WIDGET_PREFIX + id, mode);
                  }
                  editor.apply();
          
                  for (int id : allIds) {
                      updateSingleWidget(context, mgr, id);
                  }
              }
          
              public static void updateSingleWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                  int themeMode = getThemeMode(context, appWidgetId);
          
                  int layoutId;
                  switch (themeMode) {
                      case MODE_LIGHT:
                          layoutId = R.layout.widget_light;
                          break;
                      case MODE_TRANS_LIGHT:
                          layoutId = R.layout.widget_trans_light;
                          break;
                      case MODE_TRANS_DARK:
                          layoutId = R.layout.widget_trans_dark;
                          break;
                      case MODE_DARK:
                      default:
                          layoutId = R.layout.widget_dark;
                          break;
                  }
          
                  RemoteViews views = new RemoteViews(context.getPackageName(), layoutId);
          
                  // Render high-DPI monthly calendar matching tablet local date and selected theme
                  Bitmap calendarBitmap = CalendarRenderer.renderCalendar(themeMode);
                  views.setImageViewBitmap(R.id.calendar_image, calendarBitmap);
          
                  // Left side tap -> Cycle Theme Mode (Dark -> Light -> Transparent Light -> Transparent Dark)
                  Intent cycleIntent = new Intent(context, StandByWidgetProvider.class);
                  cycleIntent.setAction(ACTION_CYCLE_THEME);
                  cycleIntent.putExtra(EXTRA_WIDGET_ID, appWidgetId);
                  PendingIntent cyclePendingIntent = PendingIntent.getBroadcast(
                          context,
                          appWidgetId + 1000,
                          cycleIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  views.setOnClickPendingIntent(R.id.clock_tap_zone, cyclePendingIntent);
                  views.setOnClickPendingIntent(R.id.analog_clock, cyclePendingIntent);
          
                  // Right side tap -> Refresh Calendar & Open Native Tablet Calendar App
                  Intent calIntent = new Intent(context, StandByWidgetProvider.class);
                  calIntent.setAction(ACTION_OPEN_CALENDAR);
                  calIntent.putExtra(EXTRA_WIDGET_ID, appWidgetId);
                  PendingIntent calPendingIntent = PendingIntent.getBroadcast(
                          context,
                          appWidgetId + 2000,
                          calIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  views.setOnClickPendingIntent(R.id.calendar_tap_zone, calPendingIntent);
                  views.setOnClickPendingIntent(R.id.calendar_image, calPendingIntent);
          
                  appWidgetManager.updateAppWidget(appWidgetId, views);
              }
          
              private void openNativeCalendar(Context context) {
                  try {
                      Uri.Builder builder = CalendarContract.CONTENT_URI.buildUpon();
                      builder.appendPath("time");
                      builder.appendPath(String.valueOf(System.currentTimeMillis()));
                      Intent intent = new Intent(Intent.ACTION_VIEW, builder.build());
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                  } catch (Exception e) {
                      try {
                          Intent fallback = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_CALENDAR);
                          fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(fallback);
                      } catch (Exception ignored) {
                          Toast.makeText(context, "Calendar refreshed", Toast.LENGTH_SHORT).show();
                      }
                  }
              }
          
              private void scheduleMidnightUpdate(Context context) {
                  try {
                      AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (alarmManager == null) {
                          return;
                      }
                      Calendar midnight = Calendar.getInstance();
                      midnight.add(Calendar.DAY_OF_YEAR, 1);
                      midnight.set(Calendar.HOUR_OF_DAY, 0);
                      midnight.set(Calendar.MINUTE, 0);
                      midnight.set(Calendar.SECOND, 2);
                      midnight.set(Calendar.MILLISECOND, 0);
          
                      Intent intent = new Intent(context, StandByWidgetProvider.class);
                      intent.setAction(Intent.ACTION_DATE_CHANGED);
                      PendingIntent pi = PendingIntent.getBroadcast(
                              context,
                              9999,
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      alarmManager.set(AlarmManager.RTC, midnight.getTimeInMillis(), pi);
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF_FILE

