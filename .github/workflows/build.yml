name: Build StandBy Clock Widget APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Widget Project Files
        run: |
          mkdir -p standby_widget_build
          cd standby_widget_build
          cat << 'EOF_FILE' > "settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StandByClockWidget"
          include ':app'
          EOF_FILE

          cat << 'EOF_FILE' > "build.gradle"
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE

          cat << 'EOF_FILE' > "gradle.properties"
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF_FILE

          mkdir -p "app"
          cat << 'EOF_FILE' > "app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.standby.clockwidget'
              compileSdk 34
          
              defaultConfig {
                  applicationId "com.standby.clockwidget"
                  minSdk 31
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
          }
          EOF_FILE

          mkdir -p "app/src/main"
          cat << 'EOF_FILE' > "app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <receiver
                      android:name=".StandByWidgetProvider"
                      android:exported="true"
                      android:label="@string/widget_title">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.LOCALE_CHANGED" />
                          <action android:name="com.standby.clockwidget.ACTION_CYCLE_THEME" />
                          <action android:name="com.standby.clockwidget.ACTION_OPEN_CALENDAR" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/standby_widget_info" />
                  </receiver>
          
              </application>
          </manifest>
          EOF_FILE

          mkdir -p "app/src/main/res/values"
          cat << 'EOF_FILE' > "app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">StandBy Clock Widget</string>
              <string name="widget_title">StandBy Clock &amp; Calendar</string>
              <string name="widget_description">Live ticking analog clock and monthly calendar with Dark, Light, and Transparent modes (Tap clock to switch theme).</string>
          </resources>
          EOF_FILE

          mkdir -p "app/src/main/res/xml"
          cat << 'EOF_FILE' > "app/src/main/res/xml/standby_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="130dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="180dp"
              android:minResizeHeight="90dp"
              android:maxResizeWidth="900dp"
              android:maxResizeHeight="600dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_dark"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/widget_description" />
          EOF_FILE

          mkdir -p "app/src/main/res/drawable"
          cat << 'EOF_FILE' > "app/src/main/res/drawable/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
